<title>Wild Earth — GPU ground-cover placement prototype</title>
<!--
  Standalone prototype for docs/gpu-placement-prototype.md. Not part of the client, and changes nothing
  in it: it imports grass.js only to run its CPU placement (cellData, cardCell, fill, drain) as the
  reference, on the home tile's rasters (loadTile).
  WebGPU only (three.js r186.1 WebGPURenderer). Raw WGSL compute passes on the renderer's device
  place every grass plant of the three blade tiers and the card roles around the camera each frame and
  cull + compact them into an indirect draw; one TSL node material draws the survivors as crossed cards.
  Parameters:
    tile (utm10n_680_4280), x, n (4309, 3440: open grassland, metres east / north on the tile),
    agl (3: camera height above ground), pitch (deg below level; default by height), yaw (deg, 0 north),
    dens (1: candidate density multiplier; 1 is the client's placement, >1 is a stress test),
    mode: bench (default: equality checks, timings per view, the CPU speed simulation; results in
          window.RESULT) | view (just draw the view, for screenshots)
    checks (1), sweep (1000 cells), cells (i,j;i,j: check only these), views (1), sim (1), w, h (1280x720), msaa (1).
-->
