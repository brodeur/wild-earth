# fly.toml app configuration file generated for wild-earth on 2026-11-03T02:12:48Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'wild-earth'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  PYTHONUNBUFFERED = '1'

[[mounts]]
  source = 'we_data'
  destination = '/app/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 400
    soft_limit = 200

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
